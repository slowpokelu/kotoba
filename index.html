    <script>
      (function () {
        var theme = 'system';
        try {
          var saved = localStorage.getItem('kotoba:theme');
          if (['system', 'light', 'dark'].includes(saved)) theme = saved;
        } catch (e) {}
        document.documentElement.dataset.theme =
          theme === 'system'
            ? matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : theme;
      })();
    </script>
